<!DOCTYPE html>
<html lang="ko">
<head>
  <link href="https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안산시 중앙동 소개</title>
  <style>
    :root{
      --bg:#f6f8fc;
      --purple-1:#8c4898;
      --purple-2:#d2b2dd;
      --accent:#1e66ff;
      --text:#243044;
      --muted:#6b7280;
      --card:#ffffff;
    }

    *{box-sizing:border-box}
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding-bottom:200px;
    }

    header {
      background: linear-gradient(135deg, var(--purple-1), var(--purple-2));
      color: white;
      padding: 44px 20px;
      text-align: center;
      position: relative;
    }

    header img{height:40px}

    .home-link{ position:absolute; right:20px; top:28px; background:none; color:#ffffff; padding:0; border:none; text-decoration:none; font-weight:700; font-size:0.95rem;}

    h1 { margin: 0; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.02em;}

    header p{margin:8px 0 0 0; color:rgba(255,255,255,0.9)}

    .map-section {
      padding: 36px 20px;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .map-section img {
      width: 90%;
      max-width: 700px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(30,40,80,0.06);
      background: linear-gradient(180deg, rgba(255,255,255,0.4), rgba(255,255,255,0.2));
    }

    section {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 20px;
    }

    h2 { font-size: 1.7rem; margin-bottom: 18px; border-left: 6px solid var(--accent); padding-left: 12px; color: var(--text); font-weight:700;}

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(30,40,80,0.06);
      transition: transform .18s ease, box-shadow .18s ease;
      border: 1px solid rgba(30,40,80,0.03);
    }

    .card:hover{transform:translateY(-6px); box-shadow:0 16px 34px rgba(30,40,80,0.08)}

    .card img{
      width:100%;
      height:160px;
      object-fit:cover;
      border-radius:10px;
      margin-bottom:12px;
      background:linear-gradient(180deg, rgba(0,0,0,0.03), rgba(0,0,0,0.01));
    }

    .card-title{font-weight:700; font-size:1.08rem; color:var(--text); margin-bottom:6px}
    .card-desc{font-size:0.95rem; color:var(--muted); line-height:1.45}

    a.accent{color:var(--accent); text-decoration:none; font-weight:600}

    h1, .home-link, h2 span { font-family:'YGIghtJalnanche', sans-serif; }

@media (max-width:600px){
      h1{font-size:1.6rem}
      .map-section img{width:95%}
    }
  </style>
</head>
<body>
  <header>
    <div style="position:absolute; left:20px; top:20px; display:flex; align-items:center; gap:10px;">
      <img src="images/ansan_logo.jpeg" alt="안산시 로고" />
    </div>
    <a class="home-link" href="index.html"><span style="font-family:'YGIghtJalnanche',sans-serif;">홈으로</span></a>
    <h1><span style="font-family:'YGIghtJalnanche', sans-serif;">안산시 중앙동</span></h1>
    <p>중앙동, 안산 정중앙에 위치한 안산의 심장</p>
  </header>

  <div class="map-section">
    <h2>📍 중앙동 위치</h2>
    <img src="images/중앙동_지도.png" alt="안산시 지도 내 중앙동 위치 표시" />
    <p style="margin-top:10px; font-size:0.95rem; color:var(--muted)">(출처 : 네이버 지도)</p>
  </div>

  <section>
    <h2>🏝️ <span style="font-family:'YGIghtJalnanche',sans-serif;">관광지 추천</span></h2>
    <div class="card-grid">
      <div class="card">
        <img src="images/tour1.png" alt="경기도미술관" />
        <div class="card-title">경기도미술관</div>
        <div class="card-desc">삭막한 빌딩 숲속에서 벗어나 만끽하는 예술의 여유</div>
      </div>
      <div class="card">
        <img src="images/tour2.png" alt="도파민방탈출" />
        <div class="card-title">도파민방탈출</div>
        <div class="card-desc">흘러가는 시간 속에서 느끼는 짜릿한 도파민</div>
      </div>
      <div class="card">
        <img src="images/tour3.png" alt="펌프아케이드 안산점" />
        <div class="card-title">펌프아케이드 안산점</div>
        <div class="card-desc">평생 경험해 보지 못했을 이색 놀거리</div>
      </div>
    </div>
  </section>

  <section>
    <h2>🍽️ <span style="font-family:'YGIghtJalnanche',sans-serif;">맛집 추천</span></h2>
    <div class="card-grid">
      <div class="card">
        <img src="images/food1.png" alt="헤비스테이크" />
        <div class="card-title">헤비스테이크 안산중앙점.</div>
        <div class="card-desc">기분이 저기압일 땐 고기앞으로</div>
      </div>
      <div class="card">
        <img src="images/food2.png" alt="스시일기" />
        <div class="card-title">스시일기</div>
        <div class="card-desc">저렴한 가격으로 즐기는 고퀄리티 초밥</div>
      </div>
      <div class="card">
        <img src="images/food3.png" alt="귀큰여우" />
        <div class="card-title">귀큰여우</div>
        <div class="card-desc">풍성한 디저트가 만드는 레트로 감성
        </div>
      </div>
    </div>
  </section>
</body>
</html>
