<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>안산시 메인 화면</title>
  <style>
    body{font-family:system-ui,'Noto Sans KR',sans-serif;margin:0;background:#f3f6fb;color:#111;opacity:0.97}
    header{background:linear-gradient(90deg,#0fa35aff,#0ca67833,#ffffff);padding:28px 20px;display:flex;align-items:center;gap:18px}
    .logo{width:84px;height:84px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(10,116,218,0.12);overflow:hidden}
    .logo img{width:100%;height:100%;object-fit:contain}
    .branding{flex:1}
    .city-name{font-size:22px;font-weight:700;margin:0}
    .slogan{color:#6b7280;margin:4px 0 0}
    nav a{margin-left:12px;color:#0fa35a;text-decoration:none;font-weight:600}

    main{max-width:1100px;margin:28px auto;padding:0 20px}
    .hero{background:#fff;padding:26px;border-radius:14px;display:flex;gap:22px;align-items:center;box-shadow:0 6px 18px rgba(17,24,39,0.06)}
    .visual{flex:0 0 340px;height:180px;border-radius:12px;background:linear-gradient(135deg,#dff5e8,#ffffff);display:flex;align-items:center;justify-content:center;color:#6b7280;font-weight:700}
    .lead h1{margin:0;font-size:28px}
    .lead p{margin:10px 0;color:#6b7280}

    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:26px}
    .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 6px 18px rgba(17,24,39,0.06);transition:transform .2s ease,box-shadow .2s ease}
    .card h3{margin:0 0 8px}
    .card p{margin:0;color:#6b7280;font-size:14px}
    .card a{display:inline-block;margin-top:12px;padding:8px 10px;background:#0fa35a;color:#fff;border-radius:8px;text-decoration:none;font-size:14px}

    .card:hover{transform:translateY(-6px);box-shadow:0 10px 26px rgba(15,163,90,0.18)}

@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.hero{flex-direction:column;align-items:flex-start}.visual{width:100%}}
    @media(max-width:500px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <img src="assets/ansan-logo.png" alt="안산시 로고" />
    </div>
    <div class="branding">
      <p class="city-name">안산시 (Ansan)</p>
      <p class="slogan">함께 가꾸는 미래, 살맛나는 안산</p>
    </div>
    <nav>
      <a href="#">소개</a>
      <a href="#">행정동</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="visual">안산 메인 비주얼<br><small>이미지 추가 가능</small></div>
      <div class="lead">
        <h1>안산시 정보 안내 메인 페이지</h1>
        <p>안산시 소개, 행정동 정보, 맛집, 가볼만한 곳 등을 한눈에 볼 수 있는 메인 화면입니다.</p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <h3>고잔동</h3>
        <p>상업·주거가 조화된 단원구 중심 지역</p>
        <a href="#">보기</a>
      </div>
      <div class="card">
        <h3>대부동</h3>
        <p>(수정 필요)</p>
        <a href="#">보기</a>
      </div>
      <div class="card">
        <h3>사동</h3>
        <p>(수정 필요)</p>
        <a href="#">보기</a>
      </div>
      <div class="card">
        <h3>중앙동</h3>
        <p>안산시의 정중앙에 위치한 안산의 메카</p>
        <a href="#">보기</a>
      </div>
    </section>
  </main>
</body>
</html>
