  <link href="https://cdn.jsdelivr.net/gh/webfontworld/gmarket/GmarketSans.css" rel="stylesheet">

  <title>안산시 고잔동 소개</title>
  <style>
    :root {
      --bg: #f6f8fc;
      --navy-1: #6b7aa8;
      --navy-2: #9fb0e0;
      --accent: #1e66ff;
      --text: #243044;
      --muted: #6b7280;
      --card: #ffffff;
    }

    * { box-sizing: border-box }
    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, "Helvetica Neue", Arial;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 200px;
    }

    header {
      background: linear-gradient(135deg, var(--navy-1), var(--navy-2));
      color: white;
      padding: 44px 20px;
      text-align: center;
      position: relative;
    }

    header img { height: 40px }

    .home-link {
      position: absolute;
      right: 20px;
      top: 28px;
      background: none;
      color: #ffffff;
      padding: 0;
      border: none;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }

    h1 {
      margin: 0;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    header p {
      margin: 8px 0 0 0;
      color: rgba(255, 255, 255, 0.9)
    }

    .map-section {
      padding: 36px 20px;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    .map-section img {
      width: 80%;
      max-width: 700px;
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(30, 40, 80, 0.06);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.2));
    }

    section {
      max-width: 1100px;
      margin: 36px auto;
      padding: 0 20px;
    }

    h2 {
      font-size: 1.7rem;
      margin-bottom: 18px;
      border-left: 6px solid var(--accent);
      padding-left: 12px;
      color: var(--text);
      font-weight: 700;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 6px 18px rgba(30, 40, 80, 0.06);
      transition: transform .18s ease, box-shadow .18s ease;
      border: 1px solid rgba(30, 40, 80, 0.03);
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 34px rgba(30, 40, 80, 0.08);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.03), rgba(0, 0, 0, 0.01));
    }

    .card-title {
      font-weight: 700;
      font-size: 1.08rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .card-link {
  text-decoration: none !important;
  color: inherit !important;
  display: block;
}

    .card-desc {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.45;
    }

    a.accent {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    h1, .home-link, h2 span {
      font-family: 'YGIghtJalnanche', sans-serif;
    }

    @media (max-width: 600px) {
      h1 { font-size: 1.6rem }
      .map-section img { width: 95% }
    }
  </style>
</head>
